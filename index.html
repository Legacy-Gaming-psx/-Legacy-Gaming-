<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gaming - Inicio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #111827;
            color: #e0ffff;
            min-height: 100vh;
        }

        /* Cabecera */
        header {
            background: #1f2937;
            border-bottom: 3px solid #22d3d1;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        .logo { color: #22d3d1; font-size: 1.3rem; font-weight: bold; }

        /* Contenido Principal */
        main {
            padding-top: 80px;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        h1 {
            color: #22d3d1;
            text-align: center;
            margin: 40px 0;
            font-size: 2rem;
        }

        /* Botones */
        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }
        .boton {
            background: #22d3d1;
            color: #111;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .boton:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(34,211,209,.4);
        }

        /* Sección Imágenes */
        .seccion-info {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            align-items: center;
            margin: 50px 0;
        }
        @media(max-width:768px) {
            .seccion-info { grid-template-columns: 1fr; text-align:center; }
        }
        .img-lado {
            width: 100%;
            max-width: 350px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #374151;
        }
        .texto-centro h2 { color: #22d3d1; margin-bottom:15px; }
        .texto-centro p { color: #cbd5e1; line-height:1.6; }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            border-top: 1px solid #374151;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🎮 Portal Gaming</div>
    <span>Inicio</span>
</header>

<main>
    <h1>Bienvenido a PlayStation 1 Retro 🎮</h1>

    <div class="botones">
        <a href="#" class="boton">🏠 Inicio</a>
        <a href="emuladores.html" class="boton">💻 Emuladores</a>
    </div>

    <div class="seccion-info">
        <img src="https://picsum.photos/id/1011/500/350" alt="Juego PS1" class="img-lado">
        <div class="texto-centro">
            <h2>Resident Evil 3 & Clásicos</h2>
            <p>Disfruta sin recortes ni zoom excesivo. Los mejores juegos y emuladores solo para ti. Calidad y nostalgia garantizada.</p>
        </div>
        <img src="https://picsum.photos/id/1012/500/350" alt="Personaje PS1" class="img-lado">
    </div>
</main>

<footer>Portal Gaming © 2025 - Todo limpio y seguro ✅</footer>

</body>
