<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gaming</title> <!-- ✅ Nombre corregido -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        html, body {
            width: 100%; min-height: 100vh;
            background: linear-gradient(145deg, #0f0f14, #1a1a20);
            color: #e0ffff; overflow-x: hidden;
        }

        /* 🧭 BARRA SUPERIOR */
        .barra-cabecera {
            width: 100%; height: 65px;
            background: linear-gradient(90deg, #1a1a20, #222);
            border-bottom: 2px solid #40e0d0;
            position: fixed; top: 0; left: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
        }

        .boton-hamburguesa {
            background: transparent; border: none;
            color: #40e0d0; font-size: 26px;
            padding: 8px 12px; cursor: pointer;
            border-radius: 4px; transition: 0.2s;
        }
        .boton-hamburguesa:hover { background: rgba(64,224,208,.15); }

        .logo-barra {
            display: flex; align-items: center; gap: 8px;
            color: #40e0d0; font-size: 1.2rem; font-weight: bold;
        }
        .logo-ps { font-size: 28px; }
        .icono-buscar { color: #40e0d0; font-size: 22px; cursor: pointer; }

        /* 🕒 ESTILO PARA LA FECHA Y HORA */
        .reloj-fecha {
            text-align: center; color: #40e0d0; font-size: 0.9rem;
            padding: 8px 15px; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid #2a2a35; margin-top: 65px;
            font-weight: 500; letter-spacing: 0.5px;
        }

        /* 📋 MENÚ LATERAL */
        .menu-lateral {
            position: fixed; top: 65px; left: -100%; width: 85%; max-width: 320px;
            height: calc(100vh - 65px); background: rgba(20,20,30,.98);
            border-right: 2px solid #40e0d0; transition: left 0.3s ease;
            z-index: 9998; padding-top: 20px;
        }
        .menu-lateral.abierto { left: 0; }
        .menu-lateral a {
            display: block; padding: 16px 25px;
            color: #e0ffff; text-decoration: none; font-size: 1.1rem;
            border-bottom: 1px solid rgba(64,224,208,.15);
            transition: 0.2s;
        }
        .menu-lateral a:hover, .menu-lateral a.activo {
            background: rgba(64,224,208,.1); color: #40e0d0; padding-left: 30px;
        }

        /* 🌑 FONDO OSCURO */
        .fondo-oscuro {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
            z-index: 9997;
        }
        .fondo-oscuro.activo { display: block; }

        /* 🖼️ CONTENIDO PRINCIPAL (INICIO) */
        .contenido-imagen {
            width: 100%; min-height: calc(100vh - 110px);
            background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url('https://via.placeholder.com/1200x800/1a1a28/40e0d0?text=PORTAL+GAMING');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px 20px;
        }
        .titulo-banner {
            color: #40e0d0; font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-shadow: 0 0 15px rgba(64,224,208,.4);
            margin-bottom: 25px;
        }
        .texto-bienvenida {
            color: #e0ffff; font-size: clamp(1rem, 3vw, 1.3rem);
            max-width: 800px; line-height: 1.6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- 🧭 BARRA SUPERIOR -->
    <header class="barra-cabecera">
        <button class="boton-hamburguesa" onclick="toggleMenu()">☰</button>
        <div class="logo-barra">
            <span class="logo-ps">🎮</span>
            <span>Portal Gaming</span> <!-- ✅ NOMBRE CORREGIDO -->
        </div>
        <span class="icono-buscar">🔍</span>
    </header>

    <!-- 🕒 RELOJ Y FECHA DINÁMICA -->
    <div class="reloj-fecha" id="reloj"></div>

    <!-- 📋 MENÚ LATERAL -->
    <nav class="menu-lateral" id="menuPrincipal">
        <a href="#" class="activo">🏠 Inicio</a>
        <a href="#">🎮 Juegos</a>
        <a href="#">💻 Emuladores</a>
        <a href="#">📝 Reportar Enlace</a>
    </nav>

    <!-- 🌑 FONDO PARA CERRAR MENÚ -->
    <div class="fondo-oscuro" id="fondoCierre" onclick="toggleMenu()"></div>

    <!-- 🖼️ SECCIÓN INICIO (AQUÍ TRABAJAMOS) -->
    <main class="contenido-imagen">
        <h1 class="titulo-banner">Recordar Es Vivir Nuestra Infancia</h1>

        <!-- ✅ AQUÍ AÑADIMOS MÁS TEXTO O BOTONES -->
        <p class="texto-bienvenida">
            🎮 Bienvenido a tu lugar favorito para revivir los mejores juegos de siempre.<br>
            Aquí encontrarás diversión, nostalgia y todo lo que buscas en un solo sitio. 🚀
        </p>
    </main>

    <!-- ⚙️ SCRIPT: MENÚ + RELOJ AUTOMÁTICO -->
    <script>
        // Menú lateral
        function toggleMenu() {
            document.getElementById("menuPrincipal").classList.toggle("abierto");
            document.getElementById("fondoCierre").classList.toggle("activo");
        }

        // 🕒 RELOJ Y FECHA EN TIEMPO REAL (ESPAÑOL)
        function actualizarReloj() {
            const ahora = new Date();
            const opciones = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            document.getElementById("reloj").innerText = ahora.toLocaleString('es-ES', opciones);
        }
        actualizarReloj();
        setInterval(actualizarReloj, 1000); // Se actualiza cada segundo
    </script>

</body>
</html>
